<!doctype html>
<html lang="zh-Hant">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>我的行事曆｜115.10.16</title>
<style>
:root{--ink:#252b25;--muted:#81877e;--green:#476e54;--pale:#edf4eb}*{box-sizing:border-box}body{margin:0;background:#f6f7f4;color:var(--ink);font-family:"Microsoft JhengHei",sans-serif}button,input,select,textarea{font:inherit}.bar{padding:18px 8%;background:white;border-bottom:1px solid #e8ebe5;font-weight:700}.bar span{display:inline-grid;place-items:center;margin-right:9px;width:32px;height:32px;background:var(--green);color:white;border-radius:10px}main{max-width:1000px;width:90%;margin:38px auto}.heading{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.eyebrow{color:var(--green);font-size:11px;letter-spacing:2px}h1{margin:5px 0;font-size:34px}.date,.sub{color:var(--muted);font-size:13px}.today{background:white;border:1px solid #dce3d9;border-radius:9px;padding:10px 15px;color:var(--green);cursor:pointer}.layout{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:stretch}.card{background:white;border:1px solid #e9ebe6;border-radius:15px;box-shadow:0 8px 25px #2633220b;padding:20px}.card h2{font-size:16px;margin:0}.sub{margin:5px 0 14px}.badge{float:right;color:var(--green);background:var(--pale);padding:5px 9px;border-radius:20px;font-size:11px}.event{display:grid;grid-template-columns:72px 14px 1fr;gap:10px;padding:14px 0;border-top:1px solid #eee}.time{font-size:12px;line-height:1.6}.dot{width:10px;height:10px;margin-top:4px;border-radius:50%;background:#86a17d}.event strong{font-size:13px}.current-badge{display:inline-block;margin-left:8px;padding:3px 7px;border-radius:12px;background:#e5f3e8;color:#2f7441;font-size:10px;font-weight:700;vertical-align:middle}.tag,.meta{display:block;font-size:11px;color:var(--muted);margin-top:5px}.todo{display:flex;align-items:center;gap:10px;padding:12px 0;border-top:1px solid #eee}.todo button{width:19px;height:19px;flex:none;border:1px solid #cbd2c9;border-radius:5px;background:white;color:white;cursor:pointer}.todo.done button{background:var(--green)}.todo .edit-todo,.todo .delete-todo{width:auto;height:auto;padding:4px 7px;border:0;border-radius:6px;font-size:11px;white-space:nowrap}.todo .edit-todo{background:#edf2f7;color:#47627c}.todo .delete-todo{background:#fbefec;color:#a24c3e}.todo p{margin:0;font-size:13px}.todo .edit-input{min-width:0;flex:1;padding:6px 8px;font-size:12px}.todo.done p{text-decoration:line-through;color:#999}.todo .meta{flex:1}.status{font-size:10px;padding:5px 7px;border-radius:15px;background:#fbf1e5;color:#99662f;white-space:nowrap}.done .status{background:var(--pale);color:var(--green)}.todo-add{display:flex;gap:8px;margin-top:12px}.todo-add input{min-width:0;flex:1}.todo-add button{border:0;border-radius:9px;padding:0 14px;background:var(--green);color:#fff;cursor:pointer;white-space:nowrap}.form-card{margin-top:20px}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:grid;gap:6px}.full{grid-column:1/-1}label{font-size:11px}input,select,textarea{width:100%;padding:10px;border:1px solid #e8e9e2;border-radius:9px;background:#fdfdfb;font-size:12px}textarea{min-height:65px;resize:vertical}.submit{grid-column:1/-1;padding:12px;border:0;border-radius:9px;background:var(--green);color:white;cursor:pointer}.toast{position:fixed;right:20px;bottom:20px;padding:12px 16px;border-radius:10px;background:#26382b;color:white;opacity:0;transition:.2s}.toast.show{opacity:1}.datetime-dialog{width:min(360px,calc(100% - 32px));padding:24px;border:1px solid #e9ebe6;border-radius:16px;box-shadow:0 18px 60px #17231835}.datetime-dialog::backdrop{background:#1f2b2090}.datetime-dialog form{display:grid;gap:10px}.datetime-dialog h2{margin:0 0 8px;font-size:18px}.datetime-dialog label{margin-top:4px;font-size:12px}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:10px}.dialog-actions button{border:0;border-radius:8px;padding:9px 14px;cursor:pointer}.cancel-button{background:#f0f1ed;color:var(--ink)}.confirm-button{background:var(--green);color:white}footer{text-align:center;color:#999;font-size:11px;padding:0 0 25px}@media(max-width:720px){main{margin-top:28px}.layout{grid-template-columns:1fr}}@media(max-width:420px){h1{font-size:30px}.event{grid-template-columns:63px 12px 1fr;gap:8px}.todo{gap:7px}.status{font-size:9px}}
</style>
</head>
<body>
<header class="bar"><span>日</span>日常・行事曆</header>
<main>
<section class="heading"><div><div class="eyebrow">MY PLANNER</div><h1>行事曆</h1><div class="date" id="display-date">民國 115.10.16　・　星期五</div></div><button class="today" id="today" type="button">選擇日期 ↗</button></section>
<div class="layout">
<section class="card"><span class="badge" id="event-count">3 項</span><h2>行程表</h2><p class="sub">民國 115.10.16 的固定行程</p><div id="schedule">
<article class="event"><time class="time">08:00<br>— 09:50</time><i class="dot"></i><div><strong>設計思考與行動 app 程式設計運用</strong><span class="tag">固定行程</span></div></article>
<article class="event"><time class="time">10:00<br>— 11:50</time><i class="dot"></i><div><strong>國文 A 經典選讀</strong><span class="tag">固定行程</span></div></article>
<article class="event"><time class="time">13:00<br>— 15:50</time><i class="dot"></i><div><strong>程式設計 Python</strong><span class="tag">固定行程</span></div></article>
</div></section>
<section class="card"><span class="badge" id="todo-count">0 / 3</span><h2>我的代辦清單</h2><p class="sub">代辦事項｜完成一項，就勾選一項</p><div id="todos">
<div class="todo" data-done="false"><button class="check" type="button" aria-label="標記完成">✓</button><p>微積分 4-1</p><span class="meta">課業</span><span class="status">待處理</span><button class="edit-todo" type="button" aria-label="編輯代辦">編輯</button><button class="delete-todo" type="button" aria-label="刪除代辦">刪除</button></div>
<div class="todo" data-done="false"><button class="check" type="button" aria-label="標記完成">✓</button><p>經濟學作業</p><span class="meta">課業</span><span class="status">待處理</span><button class="edit-todo" type="button" aria-label="編輯代辦">編輯</button><button class="delete-todo" type="button" aria-label="刪除代辦">刪除</button></div>
<div class="todo" data-done="false"><button class="check" type="button" aria-label="標記完成">✓</button><p>會計小考複習</p><span class="meta">課業</span><span class="status">待處理</span><button class="edit-todo" type="button" aria-label="編輯代辦">編輯</button><button class="delete-todo" type="button" aria-label="刪除代辦">刪除</button></div>
</div><form class="todo-add" id="todo-form"><input id="todo-input" type="text" placeholder="輸入新的代辦事項…" aria-label="新的代辦事項" required><button type="submit">＋ 新增</button></form></section>
</div>
<section class="card form-card"><h2>新增行程</h2><p class="sub">記下接下來的重要安排</p><form id="event-form" class="form">
<div class="field full"><label for="name">行程名稱</label><input id="name" name="name" placeholder="例如：專題討論" required></div>
<div class="field full"><label for="date">日期</label><input id="date" name="date" type="date" value="2026-10-16" required></div>
<div class="field"><label for="start">開始時間</label><input id="start" name="start" type="time" value="10:00" required></div>
<div class="field"><label for="end">結束時間</label><input id="end" name="end" type="time" value="11:00" required></div>
<div class="field full"><label for="category">行程類別</label><select id="category" name="category"><option>一般行程</option><option>課程學習</option><option>工作專案</option><option>個人生活</option></select></div>
<div class="field full"><label for="note">備註（選填）</label><textarea id="note" name="note" placeholder="補充提醒…"></textarea></div>
<button class="submit" type="submit">＋ 加入行事曆</button></form></section>
</main>
<footer>為生活留白，也為重要的事預留時間。</footer>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<dialog id="datetime-dialog" class="datetime-dialog"><form method="dialog" id="datetime-form"><h2>選擇日期</h2><label for="selected-date">日期</label><input id="selected-date" type="date" value="2026-10-16" required><div class="dialog-actions"><button type="button" id="cancel-datetime" class="cancel-button">取消</button><button type="submit" class="confirm-button">確定</button></div></form></dialog>
<script>
const todos=document.getElementById('todos'),todoCount=document.getElementById('todo-count'),todoForm=document.getElementById('todo-form'),todoInput=document.getElementById('todo-input');
const dateDialog=document.getElementById('datetime-dialog'),dateInput=document.getElementById('selected-date');
function updateTodos(){const items=[...todos.querySelectorAll('.todo')];todoCount.textContent=`${items.filter(item=>item.dataset.done==='true').length} / ${items.length}`}
todoForm.addEventListener('submit',event=>{event.preventDefault();const title=todoInput.value.trim();if(!title)return;const item=document.createElement('div');item.className='todo';item.dataset.done='false';const check=document.createElement('button');check.className='check';check.type='button';check.setAttribute('aria-label','標記完成');check.textContent='✓';const text=document.createElement('p');text.textContent=title;const meta=document.createElement('span');meta.className='meta';meta.textContent='自訂';const status=document.createElement('span');status.className='status';status.textContent='待處理';const edit=document.createElement('button');edit.className='edit-todo';edit.type='button';edit.setAttribute('aria-label',`編輯代辦：${title}`);edit.textContent='編輯';const remove=document.createElement('button');remove.className='delete-todo';remove.type='button';remove.setAttribute('aria-label',`刪除代辦：${title}`);remove.textContent='刪除';item.append(check,text,meta,status,edit,remove);todos.append(item);todoInput.value='';updateTodos()});
todos.addEventListener('click',event=>{const edit=event.target.closest('.edit-todo');if(edit){const item=edit.closest('.todo'),title=item.querySelector('p'),input=document.createElement('input');input.className='edit-input';input.type='text';input.value=title.textContent;input.setAttribute('aria-label','編輯代辦內容');title.replaceWith(input);edit.textContent='儲存';edit.classList.replace('edit-todo','save-todo');edit.setAttribute('aria-label','儲存代辦');input.focus();input.select();return}const save=event.target.closest('.save-todo');if(save){const item=save.closest('.todo'),input=item.querySelector('.edit-input'),value=input.value.trim();if(!value){input.focus();return}const title=document.createElement('p');title.textContent=value;input.replaceWith(title);save.textContent='編輯';save.classList.replace('save-todo','edit-todo');save.setAttribute('aria-label',`編輯代辦：${value}`);updateTodos();return}const remove=event.target.closest('.delete-todo');if(remove){remove.closest('.todo').remove();updateTodos();return}const button=event.target.closest('.check');if(!button)return;const item=button.closest('.todo'),done=item.dataset.done!=='true';item.dataset.done=String(done);item.classList.toggle('done',done);button.setAttribute('aria-label',done?'取消完成':'標記完成');const status=item.querySelector('.status');status.textContent=done?'已完成':'待處理';status.className=`status ${done?'completed':'pending'}`;updateTodos()});
const form=document.getElementById('event-form'),toast=document.getElementById('toast');let timer;
function notify(message){toast.textContent=message;toast.classList.add('show');clearTimeout(timer);timer=setTimeout(()=>toast.classList.remove('show'),2500)}
function updateCurrentEvent(){const now=new Date(),today=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`,selectedDate=dateInput.value,minutes=now.getHours()*60+now.getMinutes();document.querySelectorAll('#schedule .event').forEach(item=>{let badge=item.querySelector('.current-badge');if(selectedDate!==today){if(badge)badge.remove();return}const time=item.querySelector('time').textContent.match(/(\\d{1,2}:\\d{2})\\s*[—-]\\s*(\\d{1,2}:\\d{2})/);if(!time)return;const toMinutes=value=>{const [hours,mins]=value.split(':').map(Number);return hours*60+mins},isCurrent=minutes>=toMinutes(time[1])&&minutes<toMinutes(time[2]);if(isCurrent&&!badge){badge=document.createElement('span');badge.className='current-badge';badge.textContent='目前';item.querySelector('strong').after(badge)}else if(!isCurrent&&badge){badge.remove()}})}
updateCurrentEvent();setInterval(updateCurrentEvent,30000);
form.addEventListener('submit',event=>{event.preventDefault();const data=new FormData(form);if(data.get('end')<=data.get('start')){notify('結束時間請晚於開始時間。');return}const date=new Date(`${data.get('date')}T00:00:00`),roc=`${date.getFullYear()-1911}/${String(date.getMonth()+1).padStart(2,'0')}/${String(date.getDate()).padStart(2,'0')}`,article=document.createElement('article');article.className='event';const time=document.createElement('time');time.className='time';time.textContent=`${data.get('start')} — ${data.get('end')}`;const dot=document.createElement('i');dot.className='dot';const details=document.createElement('div'),title=document.createElement('strong'),tag=document.createElement('span');title.textContent=data.get('name');tag.className='tag';tag.textContent=`${data.get('category')} · 民國 ${roc}`;details.append(title,tag);if(data.get('note').trim()){const note=document.createElement('span');note.className='tag';note.textContent=data.get('note').trim();details.append(note)}article.append(time,dot,details);document.getElementById('schedule').append(article);document.getElementById('event-count').textContent=`${document.querySelectorAll('#schedule .event').length} 項`;updateCurrentEvent();form.reset();document.getElementById('date').value='2026-10-16';notify('行程已加入！')});
document.getElementById('today').addEventListener('click',()=>dateDialog.showModal());
dateInput.addEventListener('change',updateCurrentEvent);
document.getElementById('cancel-datetime').addEventListener('click',()=>dateDialog.close());
document.getElementById('datetime-form').addEventListener('submit',event=>{event.preventDefault();const date=new Date(`${dateInput.value}T00:00:00`),rocYear=date.getFullYear()-1911,weekdays=['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];document.getElementById('display-date').textContent=`民國 ${rocYear}.${String(date.getMonth()+1).padStart(2,'0')}.${String(date.getDate()).padStart(2,'0')}　・　${weekdays[date.getDay()]}`;dateDialog.close()});
updateTodos();
</script>
</body>
</html>
